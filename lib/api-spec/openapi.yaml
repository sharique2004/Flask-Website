openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: assistant
    description: AI assistant operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ask:
    post:
      operationId: askAssistant
      tags: [assistant]
      summary: Ask the portfolio assistant
      description: Ask the mini Sharique AI assistant a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: Answer from the assistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    HistoryTurn:
      type: object
      properties:
        role:
          type: string
        text:
          type: string
      required:
        - role
        - text
    AskInput:
      type: object
      properties:
        query:
          type: string
          maxLength: 500
        history:
          type: array
          items:
            $ref: "#/components/schemas/HistoryTurn"
      required:
        - query
    AskResponse:
      type: object
      properties:
        answer:
          type: string
        source:
          type: string
      required:
        - answer
        - source
